[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krisna-training"
version = "0.2.0"
description = "Krisna Training — Diffusion Polish Tier (Qwen-Image-2.1 Supervised LoRA/DoRA, Flow-Matching DPO, and Consistency Flow Matching Distillation), Data-Forge sync bridge, and preference tooling. Planner and Sketch tiers are 100% frozen."
requires-python = ">=3.11"
dependencies = [
    "krisna-inference",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
polish = [
    "torch>=2.11.0",
    "transformers>=5.17.0",
    "diffusers>=0.41.0,<=0.42.0",
    "peft>=0.13",
    "pillow>=10.4",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests/training"]
