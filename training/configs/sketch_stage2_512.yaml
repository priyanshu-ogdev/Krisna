# Sketch tier training — Stage 2 (512px, progressive init from Stage 1).
# Canonical config path: training/configs/sketch_stage2_512.yaml

manifest_path: "./data/sketch_train_512/manifest.jsonl"
output_dir: "./checkpoints/sketch_stage2_512"

grid_h: 32
grid_w: 32
vocab_size: 16384
hidden_dim: 512
n_layers: 12
n_heads: 8
ffn_dim: 2048
dropout: 0.1
prompt_dim: 768

batch_size: 16
lr: 1.5e-4                  # lower LR for continued/fine-tune-style training
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.96             # Chang et al. 2022 (MaskGIT)
warmup_steps: 500
caption_mix_ratio: 0.95
cfg_dropout_prob: 0.1
total_steps: 60000
critic_loss_weight: 0.5
grad_clip: 1.0
use_gradient_checkpointing: true   # Required safeguard at 1024 tokens/seq

log_every: 50
checkpoint_every: 2000
num_workers: 6               # Tuned for Intel Core i9 + A6000
seed: 42

resume_from: null
init_from: "./checkpoints/sketch_stage1_256/checkpoint_final.pt"

# UPGRADE (validation loop, finding #3) — see stage1's config for the
# full rationale; unchanged for stage 2.
val_manifest_path: null
val_every: 1000
val_batches: 20

# UPGRADE (corpus-scale-aware steps, finding #4) — see stage1's config.
# 1.0 for stage2 (not 2.0) since it continues from stage1's already-
# converged weights rather than training from scratch; a full pass at
# the 512px corpus is a reasonable continuation-style budget, not a
# from-scratch one.
target_epochs: 1.0

# UPGRADE (generalization, this review pass): stage 2's real batch_size
# was already halved (32->16) purely for the quadratic attention-memory
# cost of 4x the tokens (1024 vs 256) at 512px — accumulation is free
# VRAM-wise (it trades wall-clock time, not memory) and restores stage
# 1's effective batch size of 32 for a comparably-noisy gradient
# estimate across both progressive-resolution stages, on the project's
# real A6000 48GB training target (PRD §3).
gradient_accumulation_steps: 2

# UPGRADE (SOTA research pass): 2D axial RoPE instead of a learned
# absolute position table. false = exact prior behavior, no change.
# See model.py's SketchModelConfig.use_2d_rope docstring for the full
# citation trail (Seedream 3.0 tech report's "cross-modality RoPE",
# FLUX/SD3-class DiT practice) and why this is a NEW-run choice, not a
# drop-in upgrade for an already-trained checkpoint.
use_2d_rope: false
rope_base: 10000.0
