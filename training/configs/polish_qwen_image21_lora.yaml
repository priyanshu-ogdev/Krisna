# Qwen-Image-2.1 image-conditioned LoRA/DoRA training.
# Dataset must expose condition_image, image, and caption columns.
#
# FIXED & UPGRADED (Phase 0 audit, 48GB A6000 Ada profile):
#   rank: 32 -> 64  (7B single-stream MMDiT benefits from higher capacity; 32 was a sketch-tier default)
#   use_dora: true  (Weight-Decomposed Low-Rank Adaptation, Liu et al. ICML 2024; separates magnitude & direction)
#   train_batch_size: 1 -> 4  (48GB VRAM envelope allows batch 4 with gradient_accumulation_steps 4 -> effective batch 16)
#   lora_layers: attention (to_k,to_q,to_v,to_out.0) + SwiGLU feedforward projections (img_mlp.gate_layer,img_mlp.proj,img_mlp.out)
#   lr_scheduler: constant -> cosine  (the pinned trainer has no cosine_with_warmup option)
#   lr_warmup_steps: 0 -> 200  (protection against gradient spikes on randomly-initialized LoRA weights)
#   max_train_steps: 1000 -> 5000  (1000 steps on a 125K corpus = 0.008% coverage; smoke-test, not training)
#   lora_alpha: 32 -> 32  (alpha = rank/2 = 32 is correct for MMDiT; kept intentionally — NOT alpha=rank)
#   validation: held-out rows are materialized as typed split files; the native
#               trainer does not implement val_fraction/val_every.
#
#   max_train_steps is a starting point. For larger datasets scale:
#   steps = ceil(target_passes * dataset_size / effective_batch)
#   where effective_batch = train_batch_size * gradient_accumulation_steps.

diffusers_dir: "./third_party/diffusers"
pretrained_model_name_or_path: "Qwen/Qwen-Image-2.1"
pretrained_model_revision: "d26bb61231c349cf6b7896fa83353113880e1ba3"
dataset_name: "./data/polish_qwen_image21_pairs"
instance_prompt: "a polished production UI screen"
cond_image_column: "condition_image"
image_column: "image"
caption_column: "caption"
output_dir: "./checkpoints/qwen_image21_lora"
resolution: 1024
use_aspect_ratio_buckets: true
aspect_ratio_buckets: "1024,1024;832,1248;1248,832"
random_flip: false
train_batch_size: 4
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 1.0e-4
lr_scheduler: "cosine"
lr_warmup_steps: 200
max_train_steps: 5000
mixed_precision: "bf16"
seed: 0
rank: 64
lora_alpha: 32
use_dora: true
# The official trainer requires a real condition image for validation. Set both
# fields before a validation run; the launcher refuses to silently fabricate it.
validation_prompt: null
validation_image: null
validation_epochs: 25
val_fraction: null
val_every: null
pipeline_class: "QwenImage21Pipeline"
conditioning_contract: "image_conditioned_edit"
base_weights_frozen: true
lora_layers: "to_q,to_k,to_v,to_out.0,img_mlp.gate_layer,img_mlp.proj,img_mlp.out"

# Server High-Scale Regularization & Multi-GPU Throughput (~400k Pair / ~550GB Calibrated Portfolio):
# 1. Prior Preservation Regularizer: Disabled for DoRA training. Base weights remain frozen
#    (base_weights_frozen: true), guaranteeing base model photographic manifold retention
#    without diluting low-rank adapter rank-64 capacity with unconditioned stock photography.
with_prior_preservation: false
prior_loss_weight: null
class_data_dir: null
class_prompt: null
num_class_images: null

# 2. Classifier-Free Guidance Regularization via Caption Dropout (Esser et al. ICML 2024):
#    10% caption dropout prevents text-conditioning overfit and enables CFG scale modulation at inference.
caption_dropout: 0.10

# 3. Logit-Normal Timestep Sampling (Esser et al. ICML 2024, Eq. 8):
#    Focuses continuous velocity updates in the structural UI formation window t in [0.2, 0.8].
weighting_scheme: "logit_normal"
logit_mean: 0.0
logit_std: 1.0

# 4. Optimization Regularization & Hardware Acceleration:
adam_weight_decay: 0.01
max_grad_norm: 1.0
dataloader_num_workers: 8
allow_tf32: true

# ---------------------------------------------------------------------------
# CONSUMER GPU PROFILE (8–12GB VRAM e.g. RTX 3060/4060/4070):
# To run QLoRA (Dettmers et al., NeurIPS 2023) on consumer hardware:
#   load_in_4bit: true
#   bnb_4bit_quant_type: "nf4"
#   bnb_4bit_compute_dtype: "bfloat16"
#   bnb_4bit_use_double_quant: true
#   train_batch_size: 1
#   gradient_accumulation_steps: 16
#   rank: 32
#   lora_alpha: 16
# ---------------------------------------------------------------------------
