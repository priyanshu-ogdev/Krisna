# Qwen-Image-2.1 image-conditioned LoRA training.
# Dataset must expose condition_image, image, and caption columns.
diffusers_dir: "./third_party/diffusers"
pretrained_model_name_or_path: "Qwen/Qwen-Image-2.1"
dataset_name: "./data/polish_qwen_image21_pairs"
cond_image_column: "condition_image"
image_column: "image"
caption_column: "caption"
output_dir: "./checkpoints/qwen_image21_lora"
resolution: 1024
train_batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 1.0e-4
lr_scheduler: "constant"
lr_warmup_steps: 0
max_train_steps: 1000
mixed_precision: "bf16"
seed: 0
rank: 32
lora_alpha: 32
validation_prompt: "Refine this UI design into a polished production render."
validation_epochs: 25
