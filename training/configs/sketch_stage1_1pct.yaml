# Sketch tier training — Stage 1 (256px, from scratch) for 1% dataset smoke-test.
# Hardware target: RTX 3060 (12GB VRAM), 32GB RAM, Windows OS.

manifest_path: "./data/sketch_train_256/manifest.jsonl"
output_dir: "./checkpoints/sketch_stage1_256"

grid_h: 16
grid_w: 16
vocab_size: 16384        # matches VQ codebook
hidden_dim: 512
n_layers: 12
n_heads: 8
ffn_dim: 2048
dropout: 0.1
prompt_dim: 768           # CLIP ViT-L/14 text-embedding dim

batch_size: 4            # 120 samples / 4 = 30 steps/epoch
lr: 3.0e-4
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.96         # Chang et al. 2022 (MaskGIT)
warmup_steps: 5          # scaled for 1% dataset
caption_mix_ratio: 0.85
cfg_dropout_prob: 0.1
total_steps: 30          # 1 complete epoch over 120 samples
critic_loss_weight: 0.5
grad_clip: 1.0

log_every: 5
checkpoint_every: 10
num_workers: 0           # 0 workers avoids Windows multiprocessing spawn latency
seed: 42

resume_from: null
init_from: null
