# Diffusion-DPO training for Z-Image-Turbo — Stage 2: General Human Preference Alignment.
# Canonical config path: training/configs/polish_stage2_dpo_general.yaml

preference-db: "krisna_preference_pairs.db"
blob-root: "krisna_blobs"
pretrained-model-name-or-path: "Tongyi-MAI/Z-Image-Turbo"
lora-adapter-path: null                          # UPGRADE (finding #2, [Critical]): left null
                                                    # deliberately — train_dpo.py's main() now
                                                    # auto-detects the base fine-tune's
                                                    # conventional output_dir
                                                    # (./checkpoints/polish_default_lora) when this
                                                    # is unset and loudly logs which adapter it
                                                    # continues from (or loudly warns if falling
                                                    # back to a fresh adapter because no base
                                                    # checkpoint exists yet). Set this explicitly
                                                    # only to override that auto-detection with a
                                                    # different checkpoint.
output-dir: "models/dpo_checkpoints/stage1_general"
source: ["pickapic_v2", "hpdv2"]                  # Real human-labeled general preference

# Recipe for Stage 2 (UI-Domain DPO):
# To train on UI-domain preference pairs (DesignSense-10k / DesignPref) once available:
# 1. Set `lora-adapter-path: "models/dpo_checkpoints/stage1_general"`
# 2. Set `output-dir: "models/dpo_checkpoints/stage2_domain"`
# 3. Set `source: ["designsense_10k", "designpref"]`

resolution: 512                                  # 512 deliberate for 48GB VRAM compute efficiency
beta: 2000.0                                     # Flow-matching velocity sweep candidates: [500.0, 1000.0, 2000.0]
fm-anchor-weight: 0.0
learning-rate: 1e-5
lr-warmup-steps: 100
lr-scheduler: "constant_with_warmup"
lora-rank: 32
train-batch-size: 1
gradient-accumulation-steps: 4
max-train-steps: 1000
checkpointing-steps: 200
mixed-precision: "bf16"
seed: 42

# UPGRADE (finding #4): max-train-steps above (1000) covers only ~0.2% of
# Pick-a-Pic v2 + HPDv2's combined ~1.8M preference pairs at effective
# batch 4 — a smoke-test-scale budget never rescaled once real pair
# volume was known. Setting target-passes recomputes max-train-steps at
# train-time from the ACTUAL synced pair count instead. 1.0 pass is a
# conservative starting point for a DPO stage (unlike a from-scratch
# generator, DPO risks reward-hacking drift with too MANY passes over a
# fixed, non-growing preference set — see dpo_loss.py's fm-anchor-weight
# docstring) — remove/set to null to keep max-train-steps exactly as
# configured above.
target-passes: 1.0

# UPGRADE (finding #3): heldout implicit-reward-margin validation, using
# a deterministic 5% hold-out of the synced preference pairs (matching
# the PRD's own stratified-holdout convention).
val-fraction: 0.05
val-every: 100

# UPGRADE (finding #6): gradient clipping — this loop previously had
# none at all, unlike sketch/train.py. See train_dpo.py's --max-grad-norm
# help text for why this matters specifically for beta=2000-scale DPO.
max-grad-norm: 1.0

# UPGRADE (finding #5): EMA of the trainable LoRA weights for
# diffusion/flow-matching training (this tier) — see train_dpo.py's
# --ema-decay help text for the ablation citation. Sketch tier
# deliberately does NOT get this (MaskGIT/token-based regime).
ema-decay: 0.9995

# UPGRADE (bug fix, this review pass): LoraConfig previously had no
# target_modules at all, which would raise at the first fresh-adapter
# run since Z-Image-Turbo's transformer class isn't in PEFT's built-in
# auto-resolution mapping. See train_dpo.py's --lora-target-modules help
# text for the single-stream-vs-dual-stream reasoning behind this
# default; override if the real module names differ.
lora-target-modules: "to_q,to_k,to_v,to_out.0"

# UPGRADE: LoRA-layer dropout, 0.0 preserves prior behavior exactly.
lora-dropout: 0.0

# UPGRADE (reconsidered this review pass): paired horizontal-flip
# augmentation. 0.0 = disabled (default, no behavior change). This is
# the FINAL high-fidelity stage — a flip mirrors any on-screen UI text
# into unreadable backward glyphs; only raise this once you've checked
# your preference corpus's real text density. See train_dpo.py's
# --flip-prob help text.
flip-prob: 0.0

# UPGRADE: validation can safely use a larger batch than training (no
# gradients/optimizer state during eval) — null falls back to
# train-batch-size.
val-batch-size: null
val-batches: 20
