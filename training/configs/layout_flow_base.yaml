# Research starting point; every sweep must record a receipt before adoption.
dataset_path: ./data/layout_train.jsonl
output_dir: ./checkpoints/layout_flow
max_nodes: 64
type_count: 10
hidden_dim: 512
n_layers: 4
n_heads: 8
batch_size: 64
gradient_accumulation_steps: 1
learning_rate: 0.0005
weight_decay: 0.01
warmup_steps: 2000
total_steps: 200000
grad_clip: 1.0
lock_loss_weight: 1.0
relation_loss_weight: 0.25
legality_loss_weight: 0.5
seed: 42
