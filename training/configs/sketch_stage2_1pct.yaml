# Sketch tier training — Stage 2 (512px, progressive init from Stage 1) for 1% dataset.
# Hardware target: RTX 3060 (12GB VRAM), 32GB RAM, Windows OS.

manifest_path: "./data/sketch_train_512/manifest.jsonl"
output_dir: "./checkpoints/sketch_stage2_512"

grid_h: 32
grid_w: 32
vocab_size: 16384
hidden_dim: 512
n_layers: 12
n_heads: 8
ffn_dim: 2048
dropout: 0.1
prompt_dim: 768

batch_size: 2            # 2 samples * 1024 tokens = 2048 tokens/batch
lr: 1.5e-4              # lower LR for progressive fine-tuning
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.96
warmup_steps: 3
caption_mix_ratio: 0.85
cfg_dropout_prob: 0.1
total_steps: 15          # progressive verification steps
critic_loss_weight: 0.5
grad_clip: 1.0
use_gradient_checkpointing: true   # safeguard for 1024-token sequence length

log_every: 5
checkpoint_every: 5
num_workers: 0           # Windows optimization
seed: 42

resume_from: null
init_from: "./checkpoints/sketch_stage1_256/checkpoint_final.pt"
