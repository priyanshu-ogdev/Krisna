# Phase 2 Ablation A: Standard LoRA Baseline (Attention-Only)
# Compares standard LoRA against Weight-Decomposed LoRA (DoRA, Liu et al. ICML 2024).
# Isolates: use_dora=false, attention projections only (no feed-forward style sublayers).

diffusers_dir: "./third_party/diffusers"
pretrained_model_name_or_path: "Qwen/Qwen-Image-2.1"
pretrained_model_revision: "d26bb61231c349cf6b7896fa83353113880e1ba3"
dataset_name: "./data/polish_qwen_image21_pairs"
instance_prompt: "a polished production UI screen"
cond_image_column: "condition_image"
image_column: "image"
caption_column: "caption"
output_dir: "./checkpoints/ablations/ablation_a_lora_attn"
resolution: 1024
use_aspect_ratio_buckets: true
aspect_ratio_buckets: "1024,1024;832,1248;1248,832"
random_flip: false
train_batch_size: 4
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 1.0e-4
lr_scheduler: "cosine"
lr_warmup_steps: 200
max_train_steps: 5000
mixed_precision: "bf16"
seed: 42
rank: 64
lora_alpha: 32
use_dora: false  # STANDARD LoRA ABLATION
pipeline_class: "QwenImage21Pipeline"
conditioning_contract: "image_conditioned_edit"
base_weights_frozen: true
lora_layers: "to_k,to_q,to_v,to_out.0"  # ATTENTION-ONLY (No ff.net style layers)
validation_epochs: 25
ablation_id: "A_LORA_ATTN_ONLY"
ablation_hypothesis: "Standard LoRA without DoRA decomposition experiences higher gradient variance and lower typography edge stability."
