# ==============================================================================
# SOTA MaskGIT Vision Transformer — Stage 1 (256px) for NVIDIA RTX A6000 (48GB)
# ==============================================================================
# Architecture: Deep & Wide 350M-parameter MaskGIT transformer.
# Sized specifically to saturate the 48GB A6000 VRAM envelope and 336 Tensor Cores,
# delivering SOTA UI generation fidelity, crisp component borders, and robust layouts.
#
# Hardware Envelope:
#   - GPU: RTX A6000 (48GB GDDR6 ECC, 768 GB/s bandwidth)
#   - Expected Live VRAM Usage: ~24GB - 28GB (comfortably fits, zero OOM risk)
#   - Host RAM: 128GB (utilized for multi-worker token caching & pinned DMA transfers)
# ==============================================================================

manifest_path: "./data/sketch_train_256/manifest.jsonl"
output_dir: "./checkpoints/sketch_stage1_256_sota"

grid_h: 16
grid_w: 16
vocab_size: 16384          # VQGAN codebook size
hidden_dim: 1024           # 2x width expansion (1024 vs 512)
n_layers: 24               # 2x depth expansion (24 vs 12 layers)
n_heads: 16                # 16 heads (head_dim = 64, optimal for FlashAttention / SDPA)
ffn_dim: 4096              # 4x hidden_dim
dropout: 0.05              # Low dropout at 350M scale for clean token reconstruction
prompt_dim: 768            # CLIP ViT-L/14 text-embedding dim
norm_type: "rmsnorm"       # SOTA RMSNorm for stable deep-layer gradient propagation

batch_size: 64             # Physical batch size on A6000
grad_accum_steps: 2        # Effective batch size = 128
lr: 4.5e-4                 # Scaled learning rate with warmup for effective batch size 128
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.96           # Chang et al. 2022 (MaskGIT stabilization)
warmup_steps: 2000
caption_mix_ratio: 0.95    # Betker et al. 2023 (DALL-E 3)
cfg_dropout_prob: 0.1      # Ho & Salimans 2022 (CFG)
total_steps: 100000
critic_loss_weight: 0.5
focal_gamma: 1.0           # SOTA focal loss for rare UI element boundary sharpness
grad_clip: 1.0

log_every: 50
checkpoint_every: 2000
num_workers: 8             # Tuned for Intel Core i9 + 128GB RAM (pinned DMA transfers)
seed: 42
use_gradient_checkpointing: false  # Not required at 256 tokens in 48GB VRAM (faster compute)

resume_from: null
init_from: null
