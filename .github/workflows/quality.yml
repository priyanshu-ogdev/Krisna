name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: data-forge
            test_path: tests/data_forge
          - package: training
            test_path: tests/training
          - package: inference
            test_path: tests/inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package dependencies
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then python -m pip install -e ".[dev]"; fi
      - name: Compile source
        run: python -m compileall -q ${{ matrix.package }}/src
      - name: Run package tests
        run: python -m pytest ${{ matrix.test_path }} -q

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check whitespace
        run: git diff --check
      - name: Check tracked generated artifacts
        shell: bash
        run: |
          ! git ls-files | grep -E '(^|/)(__pycache__|node_modules|target)/|\.(db|sqlite3?|pyc|safetensors|ckpt|pt|gguf)$'
