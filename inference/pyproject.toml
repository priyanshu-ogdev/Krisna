[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krivex-inference"
version = "0.2.0"
description = "Krivex Inference — Swap Orchestrator, Design State Manager, real model backends, and the verifier stack (final no-RLHF-loop PRD revision). Split out of krivex-orchestrator v0.1.0 as part of the training/inference separation — see docs/inference/ARCHITECTURE.md."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Everything needed to run the orchestrator itself, plus MockBackend —
# no GPU or model weights required.
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
# Real backends (Planner Qwen3.5-9B, Sketch Cassowary Simplex, Polish Qwen-Image-2.1) — GPU required.
# Unified all-Qwen architecture running in a single virtual environment.
backends = [
    "torch>=2.11.0",
    "transformers>=5.17.0",
    "diffusers @ git+https://github.com/huggingface/diffusers.git@d26bb61231c349cf6b7896fa83353113880e1ba3",
    "bitsandbytes>=0.43",
    "pillow>=10.4",
    "torchvision>=0.26.0",
]
# Optional vLLM 0.29 + PyTorch 2.11+ stack (Linux/CUDA container; excluded from Windows base to avoid wheel build failures)
planner-vllm = [
    "vllm==0.29.0",
    "torch>=2.11.0",
    "transformers>=5.17.0",
]
# Windows-compatible native GBNF Planner runtime
planner-llama = [
    "llama-cpp-python>=0.3.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
krivex_inference = ["assets/fonts/*.ttf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests live at the monorepo root now, not nested in this package — see
# docs/architecture/DIRECTORY_LAYOUT.md. Run pytest from the repo root
# (krivex/), not from inference/, for this path to resolve.
testpaths = ["../tests/inference"]
