    load_on_demand: true
    capabilities:
    - text
    - vision
    vram_estimate_gb: 6
  embeddings:
    model_id: openai/clip-vit-large-patch14-336
    revision: main
    dtype: float16
    device: cuda
    role: image_embeddings
    vram_estimate_gb: 2
  product_planner:
    model_id: Qwen/Qwen3.5-9B
    role: product_planner
