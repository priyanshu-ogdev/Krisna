  tier2:
    model_id: Qwen/Qwen2-VL-7B-Instruct-AWQ
    revision: main
    quantization: awq
    dtype: auto
    max_model_len: 8192
    gpu_memory_utilization: 0.9
    trust_remote_code: true
    role: escalation_engine
