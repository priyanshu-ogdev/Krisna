datasets:
  figma2code:
    display_name: Figma2Code (Community Figma Designs)
    source_type: huggingface
    repo_id: xcodemind/Figma2Code
    revision: main
    category: web_ui
    expected_record_count: 50000
    license_url: https://huggingface.co/datasets/xcodemind/Figma2Code
    license_status: verified
    license_notes: MIT License. Extremely high-quality UI/UX design aesthetic sourced
      from Figma.
    fetch_config:
      download_mode: hf_parquet_images
      file_patterns:
      - '*.parquet'
      sample_size: 40
  ui_vision:
    display_name: UI-Vision
    source_type: huggingface
    repo_id: ServiceNow/ui-vision
    revision: main
    category: desktop_ui
    expected_record_count: 10000
    license_url: https://huggingface.co/datasets/ServiceNow/ui-vision
    license_status: unverified
    license_notes: Desktop GUI perception.
    fetch_config:
      file_patterns:
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.json'
      image_column: image
      sample_size: 150
  screenspot:
    display_name: ScreenSpot (Cross-Platform GUI)
    source_type: huggingface
    repo_id: bevaya/ScreenSpot
    revision: main
    category: cross_platform_ui
    expected_record_count: 1272
    license_url: https://huggingface.co/datasets/bevaya/ScreenSpot
    license_status: verified
    license_notes: 'CONFIRMED Apache-2.0 directly on the live dataset card. Multi-OS
      UI screenshots (macOS, Windows, iOS) with element bounding boxes and natural
      language instructions. Eliminates single-OS bias.

      '
    fetch_config:
      download_mode: hf_parquet_images
      file_patterns:
      - '*.parquet'
      image_column: image
      caption_column: instruction
      sample_size: 40
  seeclick:
    display_name: SeeClick (Web & Desktop Screens)
    source_type: huggingface
    repo_id: moondream/seeclick
    revision: main
    category: web_ui
    expected_record_count: 250000
    license_url: https://huggingface.co/datasets/moondream/seeclick
    license_status: verified
    license_notes: 'CONFIRMED Apache-2.0 upstream (SeeClick GUI agent foundation).
      Pristine 1920x1080 Full HD desktop and web application screens with structured
      element hierarchies. Ingested via streaming parquet reader to prevent memory
      blowup.

      '
    fetch_config:
      download_mode: hf_parquet_images
      file_patterns:
      - '*.parquet'
      image_column: image
      sample_size: 40
  android_control:
    display_name: Android Control (Google Research)
    source_type: huggingface
    repo_id: ckg/AndroidControlParsedWithImages-20k
    revision: main
    category: mobile_ui
    expected_record_count: 20000
    license_url: https://github.com/google-research/google-research/tree/master/android_control
    license_status: verified
    license_notes: 'CONFIRMED Apache-2.0 (Google Research Android Control upstream).
      1080x2400 modern Android Material Design 3 screens across 833 apps, paired with
      natural language multi-turn task instructions. Provides modern mobile UI distributions
      replacing 2017 RICO styling.

      '
    fetch_config:
      download_mode: hf_parquet_images
      file_patterns:
      - '*.parquet'
      image_column: png
      caption_column: json.messages.0.content
      sample_size: 40
  mind2web:
    display_name: Multimodal Mind2Web (Web Screens)
    source_type: huggingface
    repo_id: osunlp/Multimodal-Mind2Web
    revision: main
    category: web_ui
    expected_record_count: 15000
    license_url: https://huggingface.co/datasets/osunlp/Multimodal-Mind2Web
    license_status: verified
    license_notes: 'CONFIRMED OpenRAIL license on dataset card. Web interaction screenshots
      with confirmed task prompts across 2,000+ domains. Uses viewport cropping (max_aspect_ratio:
      2.0) to convert tall full-page scroll captures into standard above-the-fold
      UI screens.

      '
    fetch_config:
      download_mode: hf_parquet_images
      file_patterns:
      - '*.parquet'
      image_column: screenshot
      caption_column: confirmed_task
      viewport_crop: true
      max_aspect_ratio: 2.0
      sample_size: 40
  showui_desktop:
    display_name: ShowUI Desktop
    source_type: huggingface
    repo_id: showlab/ShowUI-desktop
    revision: main
    category: desktop_ui
    expected_record_count: 7496
    license_url: https://huggingface.co/datasets/showlab/ShowUI-desktop
    license_status: verified
    license_notes: Fills the desktop UI domain gap. High-fidelity desktop UIs with
      functional spatial info.
    fetch_config:
      download_mode: hf_parquet_images
      file_patterns:
      - '*.parquet'
      image_column: image
      sample_size: 40
  wave_ui:
    display_name: Wave-UI (AgentSea)
    source_type: huggingface
    repo_id: agentsea/wave-ui
    revision: main
    category: web_ui
    expected_record_count: 25000
    license_url: https://huggingface.co/datasets/agentsea/wave-ui
    license_status: verified
    license_notes: AgentSea UI automation dataset. Highly curated for text-rich OCR
      and coordinate automation.
    fetch_config:
      download_mode: hf_parquet_images
      file_patterns:
      - '*.parquet'
      image_column: image
      sample_size: 40
  websight:
    display_name: WebSight
    source_type: huggingface
    repo_id: HuggingFaceM4/WebSight
    revision: main
    category: web_ui
    expected_record_count: 2000000
    license_url: https://huggingface.co/datasets/HuggingFaceM4/WebSight
    license_status: unverified
    license_notes: Massive synthetic web UI dataset. Pairs HTML/CSS with rendered
      screenshots.
    fetch_config:
      download_mode: hf_parquet_images
      file_patterns:
      - '*.parquet'
      image_column: image
      sample_size: 40
  gamelabel_10k:
    display_name: GameLabel-10K
    source_type: huggingface
    repo_id: Jonathan-Zhou/GameLabel-10k
    revision: main
    category: dpo_preference_general
    expected_record_count: 9800
    license_url: https://huggingface.co/datasets/Jonathan-Zhou/GameLabel-10k
    license_status: verified
    license_notes: 'Apache 2.0, confirmed on the live dataset card. Real crowdsourced
      human preference votes (mobile-game players, rewarded with in-game currency
      â€” arXiv:2409.19830), NOT AI-judge/synthetic labeling. General T2I domain (game-style/illustrative
      prompts), same category as Pick-a-Pic/HPDv2 above â€” supplements Stage-1 general
      DPO signal, does not close the Stage-2 UI-domain gap (designsense_10k/designpref
      below remain unreleased for that).

      '
    fetch_config:
      download_mode: gamelabel_csv
      parquet_revision: refs/convert/parquet
      sample_size: 40
  taste:
    display_name: TASTE (multi-axis design-preference benchmark)
    source_type: huggingface
    repo_id: purvanshi/TASTE
    revision: main
    category: eval_design_multiaxis
    expected_record_count: 1600
    license_url: https://github.com/purvanshi-lica/taste/blob/main/LICENSE
    license_status: unverified
    license_notes: 'CONFIRMED real and public. Two disjoint cohorts of five professional
      designers each (ten total), nine criteria (typography, aesthetics, spatial,
      tone, ...), ranking outputs from four current T2I models â€” 1,600 ratings per
      criterion, both pairwise comparisons and derived 4-way rankings released. Ships
      with its own signal-validation framework (Kendall''s tau, majority-vote probability,
      Condorcet cycles against iid-uniform nulls) â€” worth adopting for this project''s
      own DPO ablation reporting, not just using the labels. Too small to train on
      but genuinely multi-dimensional and human-expert â€” used as held-out evaluation
      only.

      '
    eval_only: true
    fetch_config:
      download_mode: eval_reference
      file_patterns:
      - '*.parquet'
      - '*.json'
      - '*.jsonl'
  partiprompts:
    display_name: PartiPrompts (P2)
    source_type: huggingface
    repo_id: nateraw/parti-prompts
    revision: main
    category: eval_prompt_diversity
    expected_record_count: 1632
    license_url: https://huggingface.co/datasets/nateraw/parti-prompts
    license_status: unverified
    license_notes: Apache 2.0, confirmed on the dataset card. Prompts only (PartiPrompts.tsv),
      no images â€” used to diversify the held-out evaluation prompt set, never for
      training.
    eval_only: true
    fetch_config:
      download_mode: eval_reference
      file_patterns:
      - '*.tsv'
      - '*.csv'
      - '*.json'
  pd12m:
    display_name: PD12M (Public Domain 12M)
    source_type: huggingface
    repo_id: Spawning/PD12M
    revision: main
    category: general_visual
    expected_record_count: 12400000
    license_url: https://cdla.dev/permissive-2-0/
    license_status: unverified
    license_notes: 'CDLA-Permissive-2.0, entirely public domain / CC0 sourced. Should
      be a clean pass through the License Agent, but still runs through it rather
      than being assumed. NOTE: this dataset ships as parquet metadata + external
      image URLs (hosted on the pd12m S3 bucket), not bundled image files â€” the
      fetcher needs an img2dataset-style download path, not a plain file-pattern glob.

      '
    fetch_config:
      file_patterns:
      - '*.parquet'
      download_mode: url_list
      image_url_column: url
      caption_column: caption
      sample_size: 40
      download_concurrency: 32
      download_timeout_seconds: 15
      note: Metadata-only repo; images are fetched via URL column, not bundled files.
  pickapic_v2:
    display_name: Pick-a-Pic v2
    source_type: huggingface
    repo_id: yuvalkirstain/pickapic_v2
    revision: main
    category: dpo_preference_general
    expected_record_count: 500000
    license_url: https://huggingface.co/datasets/yuvalkirstain/pickapic_v2
    license_status: unverified
    license_notes: 'Real, web-collected human preference comparisons (pickapic.io),
      MIT license per the PickScore repo. General text-to-image domain, not UI-specific
      â€” this is Stage-1 DPO signal (broad aesthetic alignment), not a substitute
      for the UI-domain datasets below. Image bytes are embedded directly in columns
      jpg_0/jpg_1 per the dataset card â€” no external URL fetch needed.

      '
    fetch_config:
      file_patterns:
      - '*.parquet'
      download_mode: preference_pair
      image_a_column: jpg_0
      image_b_column: jpg_1
      prompt_column: caption
      label_column: label_0
      label_convention: index
      sample_size: 40
  hpdv2:
    display_name: HPDv2 (Human Preference Dataset v2)
    source_type: huggingface
    repo_id: ymhao/HPDv2
    revision: main
    category: dpo_preference_general
    expected_record_count: 798000
    license_url: https://huggingface.co/datasets/ymhao/HPDv2
    license_status: unverified
    license_notes: Apache 2.0, confirmed on the dataset card. Real human annotator
      rankings, general T2I domain.
    fetch_config:
      download_mode: hpdv2_ranked_list
      annotation_file: train.json
      sample_size: 40
  designsense_10k:
    display_name: DesignSense-10k
    source_type: huggingface
    repo_id: null
    revision: main
    category: dpo_preference_ui_layout
    expected_record_count: 10235
    license_url: https://arxiv.org/abs/2602.23438
    license_status: unverified
    license_notes: 'CONFIRMED CC BY-NC-ND 4.0 (arXiv''s own license badge) â€” a harder
      blocker than the missing repo_id. NoDerivs conflicts directly with this pipeline''s
      recaption/re-annotation discipline (same category of issue as UICrit''s NoDerivs,
      see below), and NonCommercial is a separate problem for any project with a product
      track attached, not just the research paper. Even if a public release appears
      later, treat this as needing dedicated legal sign-off before use, not just a
      License Agent pass â€” do not assume "found the repo" alone clears it. Pair
      construction also reportedly includes a "VLM-based refinement" curation step
      â€” confirm that touches layout *selection* only, not pixel generation, if this
      is ever revisited.

      '
    fetch_config:
      download_mode: preference_pair
      sample_size: 40
  designpref:
    display_name: DesignPref
    source_type: huggingface
    repo_id: null
    revision: main
    category: dpo_preference_ui_layout
    expected_record_count: 12000
    license_url: null
    license_status: unverified
    license_notes: 'Real professional-designer pairwise comparisons per the paper
      (12,000 pairs, 20 designers, identity-linked). Notably reports low inter-designer
      agreement (Krippendorff''s alpha ~0.25) â€” worth citing directly as a limitation,
      not just training signal, since it documents that "good UI" is genuinely contested
      even among experts. License unknown until a release exists; do not assume permissive.

      '
    fetch_config:
      download_mode: preference_pair
      sample_size: 40
  uicrit:
    display_name: UICrit (UI Critique Dataset)
    source_type: github
    repo_url: https://github.com/google-research-datasets/uicrit
    branch: main
    category: ui_critique
    expected_record_count: 1000
    license_url: https://arxiv.org/abs/2407.08850
    license_status: unverified
    license_notes: 'CRITICAL: seeds the DPO preference pairs and trains the Tier-1
      Audit Agent rubric â€” verify this one carefully before treating it as excluded_pending_review
      boilerplate. Per the paper, licensed CC BY-ND (Attribution-NoDerivs), which
      restricts redistribution of modified/derivative versions â€” flag for manual
      legal review even if the License Agent scores it otherwise, since NoDerivs interacts
      awkwardly with a pipeline that recaptions/re-annotates everything.

      '
    annotation_only: true
    fetch_config:
      file_patterns:
      - '*.json'
      - '*.csv'
      sample_size: 40
watcher_scan_targets:
- query: UI design dataset
  platforms:
  - huggingface
  - github
  - paperswithcode
  min_records: 1000
- query: mobile app screenshot dataset
  platforms:
  - huggingface
  min_records: 5000
- query: web interface design dataset
  platforms:
  - huggingface
  min_records: 1000
- query: DesignSense-10k Adobe layout preference dataset
  platforms:
  - huggingface
  - github
  min_records: 1
- query: DesignPref UI design preference dataset release
  platforms:
  - huggingface
  - github
  min_records: 1
