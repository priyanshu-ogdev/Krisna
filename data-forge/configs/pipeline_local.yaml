pipeline:
  version: 0.14.0
  dataset_version_prefix: krisna_v
paths:
  raw: raw/
  scrubbed: scrubbed/
  processed:
    root: processed/
    latents_zimage: processed/latents_zimage/
    vq_tokens_sketch: processed/vq_tokens_sketch/
    control_tokens: processed/control_tokens/
    dpo_latents: processed/dpo_latents/
  training_pool: training_pool/
  heldout: heldout/
  manifests: manifests/
  checkpoints: .checkpoints/
  logs: logs/
  registry_reports: registry_reports/
  audit_reports: audit_reports/
  compliance_briefs: compliance_briefs/
  ui_critique: ui_critique/
  preference_pairs: preference_pairs/
orchestrator:
  chunk_size: 10000
  max_retries_per_record: 2
  fail_fast: false
  checkpoint_enabled: true
stages:
  s00_manifest_planning:
    enabled: true
  s01_fetch:
    enabled: true
    max_concurrent_downloads: 32
    download_timeout_seconds: 3600
    license_confidence_threshold: 0.85
  s01_5_uicrit_join:
    enabled: true
  s01_6_preference_pairs:
    enabled: true
    face_detection_confidence: 0.5
    blur_kernel_size: 99
    safety_confidence_threshold: 0.8
  s02_dedup:
    enabled: true
    embedding_model: openai/clip-vit-large-patch14-336
    embedding_batch_size: 64
    faiss_index_type: IVF4096,Flat
    faiss_nprobe: 64
    similarity_threshold: 0.95
    exact_hash_dedup: true
  s03_quality:
    enabled: true
    aesthetic_score_threshold: 0.4
    min_resolution:
    - 256
    - 256
    max_resolution:
    - 8192
    - 8192
    batch_size: 32
  s03_5_pii_scrub:
    enabled: true
    face_detection_confidence: 0.5
    blur_kernel_size: 99
  s04_safety:
    enabled: true
    confidence_threshold: 0.8
    batch_size: 32
  s04_5_escalation:
    enabled: true
  s05_recaption:
    enabled: true
    batch_size: 16
    max_caption_tokens: 512
    ocr_enrichment: true
  s05_ocr_enrichment:
    enabled: true
    batch_size: 16
    max_ocr_tokens: 1024
  s06_structure:
    enabled: true
    batch_size: 16
    max_retries_on_schema_fail: 1
    max_structure_tokens: 2048
  s05_5_pii_text_redact:
    enabled: true
    regex_patterns:
      email: '[\w.+-]+@[\w-]+\.[\w.]+'
      phone: \+?[\d\s\-\(\)]{7,15}
      ssn: \b\d{3}-\d{2}-\d{4}\b
      credit_card: \b\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}\b
    redaction_token: '[REDACTED]'
  s07_routing:
    enabled: true
    ui_first_ratio: 0.7
    overflow_action: exclude
  s08_encoding:
    enabled: true
    canny_low_threshold: 50
    canny_high_threshold: 150
  s08_5_dpo_encoding:
    enabled: false
  s09_heldout:
    enabled: true
    heldout_fraction: 0.05
    stratify_by:
    - domain
    - source
    - quality_score_bucket
  s10_audit:
    enabled: true
    sample_rate: 0.03
    min_samples: 200
    pass_rate_threshold: 0.95
    ensemble_escalation: true
  s11_registry_watcher:
    enabled: true
  s12_model_data_export:
    enabled: true
storage:
  safety_margin: 0.1
  per_record_estimates:
    raw_image_bytes: 500000
    scrubbed_image_bytes: 500000
    z_image_latent_bytes: 32768
    vq_tokens_bytes: 8192
    control_map_bytes: 4096
    metadata_bytes: 2048
    preference_pair_source_bytes: 1000000
    preference_pair_latent_bytes: 65536
    preference_pair_metadata_bytes: 1024
