# Candidate catalog, not an approved training allowlist. Counts and historical
# license notes below are registry claims, not realized counts or legal review.
# Approve sources only after pinned provenance, asset rights, and sample review.
# `expected_record_count` is an upstream/registry count claim. A
# `fetch_config.sample_size` is only a configured download cap; neither field is
# evidence that the records are present locally. The explicit source metadata
# below keeps candidate status, synthetic provenance, and intended targets
# separate so an unverified source cannot become training-eligible by accident.
datasets:
  pd12m:
    enabled: false
    display_name: "PD12M (Public Domain 12M)"
    source_type: "huggingface"
    repo_id: "Spawning/PD12M"
    revision: "main"
    category: general_visual
    expected_record_count: 12400000
    training_eligible: false
    synthetic: false
    synthetic_status: real
    provenance_url: https://huggingface.co/datasets/Spawning/PD12M
    quality_tier: unrated
    training_targets: []
    license_url: https://cdla.dev/permissive-2-0/
    license_status: unverified
    license_notes: 'CDLA-Permissive-2.0, entirely public domain / CC0 sourced. Should be a clean pass through the License Agent, but still runs through it rather than being assumed. NOTE: this dataset ships as parquet metadata + external image URLs (hosted on the pd12m S3 bucket), not bundled image files â€” the fetcher needs an img2dataset-style download path, not a plain file-pattern glob.

      '
    note: "Quarantined: general web imagery is irrelevant to the UI wireframe-to-screenshot objective and external URL rights are not a training receipt."
    fetch_config:
      file_patterns:
        - '*.parquet'
      download_mode: url_list
      image_url_column: url
      caption_column: caption
      sample_size: 45000
      download_concurrency: 32
      download_timeout_seconds: 15
      note: Metadata-only repo; images are fetched via URL column, not bundled files.
  pickapic_v2:
    enabled: false
    display_name: Pick-a-Pic v2
