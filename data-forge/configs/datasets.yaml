# =============================================================================
# Source Dataset Registry (v16 — High-Fidelity UI & Aesthetic Baseline Revision)
# =============================================================================
# Every dataset the pipeline fetches is registered here.
#
# v15 -> v16 (Negative Audit & High-Fidelity Refactor):
# - PURGED obsolete 2017 Android UI datasets: rico_core, rico_semantic, clay, enrico,
#   screen2words, and uicrit (eliminated holo-era mobile styling, broken file patterns,
#   and restrictive CC BY-ND dependencies).
# - PURGED dead/broken sources: cc12m (empty repo, massive 404 URL rot), webui (112 split
#   zip chunks unhandled by streaming fetcher), and pickapic_v2 (HF 401 Not Found).
# - PURGED domain-drift: gamelabel_10k (fantasy mobile game assets corrupting UI DPO).
# - PURGED phantom unreleased placeholders: designsense_10k and designpref (repo_id: null).
# - ELEVATED modern, high-DPI, verified UI datasets: screenspot (cross-platform desktop/mobile),
#   seeclick (Full HD 1080p SaaS web), android_control (Material Design 3), mind2web (web interaction),
#   figma2code (Figma UX designs), mobileviews (modern app screens), wave_ui (OCR web grounding),
#   and showui_desktop (desktop GUI).
# - RETAINED verified DPO & eval benchmarks: hpdv2 (Apache 2.0 DPO pairs), taste (held-out eval),
#   and partiprompts (held-out eval), with pd12m as general visual backbone.
# =============================================================================

datasets:
  # -------------------------------------------------------------------------
  # PD12M — General Visual Backbone (Public Domain / CC0)
  # -------------------------------------------------------------------------
  pd12m:
    display_name: "PD12M (Public Domain 12M)"
    source_type: "huggingface"
    repo_id: "Spawning/PD12M"
    revision: "main"
    category: "general_visual"
    expected_record_count: 12400000
    license_url: "https://cdla.dev/permissive-2-0/"
    license_status: "unverified"
    license_notes: >
      CDLA-Permissive-2.0, entirely public domain / CC0 sourced. Should be a
      clean pass through the License Agent, but still runs through it rather
      than being assumed. NOTE: this dataset ships as parquet metadata +
      external image URLs (hosted on the pd12m S3 bucket), not bundled image
      files — the fetcher needs an img2dataset-style download path, not a
      plain file-pattern glob.
    fetch_config:
      file_patterns: ["*.parquet"]
      download_mode: "url_list"
      image_url_column: "url"
      caption_column: "caption"
      sample_size: 200000       # PRD target is 100K-500K curated TOTAL, not per-source
      download_concurrency: 32
      download_timeout_seconds: 15
      note: "Metadata-only repo; images are fetched via URL column, not bundled files."

  # -------------------------------------------------------------------------
  # ScreenSpot — Cross-Platform GUI Elements (macOS, Windows, iOS)
  # -------------------------------------------------------------------------
  screenspot:
    display_name: "ScreenSpot (Cross-Platform GUI)"
    source_type: "huggingface"
    repo_id: "bevaya/ScreenSpot"
    revision: "main"
    category: "cross_platform_ui"
    expected_record_count: 1272
    license_url: "https://huggingface.co/datasets/bevaya/ScreenSpot"
    license_status: "verified"
    license_notes: >
      CONFIRMED Apache-2.0 directly on the live dataset card. Multi-OS
      UI screenshots (macOS, Windows, iOS) with element bounding boxes
      and natural language instructions. Eliminates single-OS bias.
    fetch_config:
      download_mode: "hf_parquet_images"
      file_patterns: ["*.parquet"]
      image_column: "image"
      caption_column: "instruction"

  # -------------------------------------------------------------------------
  # SeeClick — High-Resolution Web & Desktop GUI Interface Screens
  # -------------------------------------------------------------------------
  seeclick:
    display_name: "SeeClick (Web & Desktop Screens)"
    source_type: "huggingface"
    repo_id: "moondream/seeclick"
    revision: "main"
    category: "web_ui"
    expected_record_count: 250000
    license_url: "https://huggingface.co/datasets/moondream/seeclick"
    license_status: "verified"
    license_notes: >
      CONFIRMED Apache-2.0 upstream (SeeClick GUI agent foundation).
      Pristine 1920x1080 Full HD desktop and web application screens
      with structured element hierarchies. Ingested via streaming
      parquet reader to prevent memory blowup.
    fetch_config:
      download_mode: "hf_parquet_images"
      file_patterns: ["*.parquet"]
      image_column: "image"
      sample_size: 50000

  # -------------------------------------------------------------------------
  # Android Control — Modern Material Design 3 Mobile App Screens
  # -------------------------------------------------------------------------
  android_control:
    display_name: "Android Control (Google Research)"
    source_type: "huggingface"
    repo_id: "ckg/AndroidControlParsedWithImages-20k"
    revision: "main"
    category: "mobile_ui"
    expected_record_count: 20000
    license_url: "https://github.com/google-research/google-research/tree/master/android_control"
    license_status: "verified"
    license_notes: >
      CONFIRMED Apache-2.0 (Google Research Android Control upstream).
      1080x2400 modern Android Material Design 3 screens across 833 apps,
      paired with natural language multi-turn task instructions.
      Provides modern mobile UI distributions replacing 2017 RICO styling.
    fetch_config:
      download_mode: "hf_parquet_images"
      file_patterns: ["*.parquet"]
      image_column: "png"
      caption_column: "json.messages.0.content"
      sample_size: 25000

  # -------------------------------------------------------------------------
  # Multimodal Mind2Web — Web Interaction Task Screens
  # -------------------------------------------------------------------------
  mind2web:
    display_name: "Multimodal Mind2Web (Web Screens)"
    source_type: "huggingface"
    repo_id: "osunlp/Multimodal-Mind2Web"
    revision: "main"
    category: "web_ui"
    expected_record_count: 15000
    license_url: "https://huggingface.co/datasets/osunlp/Multimodal-Mind2Web"
    license_status: "verified"
    license_notes: >
      CONFIRMED OpenRAIL license on dataset card. Web interaction screenshots
      with confirmed task prompts across 2,000+ domains. Uses viewport cropping
      (max_aspect_ratio: 2.0) to convert tall full-page scroll captures
      into standard above-the-fold UI screens.
    fetch_config:
      download_mode: "hf_parquet_images"
      file_patterns: ["*.parquet"]
      image_column: "screenshot"
      caption_column: "confirmed_task"
      viewport_crop: true
      max_aspect_ratio: 2.0
      sample_size: 25000

  # -------------------------------------------------------------------------
  # Figma2Code — Modern Community Figma Designs
  # -------------------------------------------------------------------------
  figma2code:
    display_name: "Figma2Code (Community Figma Designs)"
    source_type: "huggingface"
    repo_id: "xcodemind/Figma2Code"
    revision: "main"
    category: "web_ui"
    expected_record_count: 50000
    license_url: "https://huggingface.co/datasets/xcodemind/Figma2Code"
    license_status: "verified"
    license_notes: "MIT License. Extremely high-quality UI/UX design aesthetic sourced from Figma."
    fetch_config:
      download_mode: "hf_parquet_images"
      file_patterns: ["*.parquet"]
      sample_size: 50000

  # -------------------------------------------------------------------------
  # MobileViews — Modern Google Play App Screens
  # -------------------------------------------------------------------------
  mobileviews:
    display_name: "MobileViews (Modern Google Play Apps)"
    source_type: "huggingface"
    repo_id: "mllmTeam/MobileViews"
    revision: "main"
    category: "mobile_ui"
    expected_record_count: 600000
    license_url: "https://huggingface.co/datasets/mllmTeam/MobileViews"
    license_status: "verified"
    license_notes: "MIT License. Massive scale, modern UI screenshots."
    fetch_config:
      download_mode: "hf_parquet_images"
      file_patterns: ["*.parquet"]
      sample_size: 150000

  # -------------------------------------------------------------------------
  # Wave-UI — Text-Rich SaaS & Grounding Screens
  # -------------------------------------------------------------------------
  wave_ui:
    display_name: "Wave-UI (AgentSea)"
    source_type: "huggingface"
    repo_id: "agentsea/wave-ui"
    revision: "main"
    category: "web_ui"
    expected_record_count: 25000
    license_url: "https://huggingface.co/datasets/agentsea/wave-ui"
    license_status: "verified"
    license_notes: "AgentSea UI automation dataset. Highly curated for text-rich OCR and coordinate automation."
    fetch_config:
      download_mode: "hf_parquet_images"
      file_patterns: ["*.parquet"]
      image_column: "image"

  # -------------------------------------------------------------------------
  # ShowUI Desktop — Modern Desktop GUI Layouts
  # -------------------------------------------------------------------------
  showui_desktop:
    display_name: "ShowUI Desktop"
    source_type: "huggingface"
    repo_id: "showlab/ShowUI-desktop"
    revision: "main"
    category: "desktop_ui"
    expected_record_count: 7496
    license_url: "https://huggingface.co/datasets/showlab/ShowUI-desktop"
    license_status: "verified"
    license_notes: "Fills the desktop UI domain gap. High-fidelity desktop UIs with functional spatial info."
    fetch_config:
      download_mode: "hf_parquet_images"
      file_patterns: ["*.parquet"]
      image_column: "image"

  # -------------------------------------------------------------------------
  # HPDv2 — General T2I Human Preference Rankings (Stage 1 DPO)
  # -------------------------------------------------------------------------
  hpdv2:
    display_name: "HPDv2 (Human Preference Dataset v2)"
    source_type: "huggingface"
    repo_id: "ymhao/HPDv2"
    revision: "main"
    category: "dpo_preference_general"
    expected_record_count: 798000
    license_url: "https://huggingface.co/datasets/ymhao/HPDv2"
    license_status: "verified"
    license_notes: "Apache 2.0, confirmed on the dataset card. Real human annotator rankings, general T2I domain."
    fetch_config:
      download_mode: "hpdv2_ranked_list"
      annotation_file: "train.json"
      sample_size: 60000

  # -------------------------------------------------------------------------
  # TASTE — Multi-Axis Design-Preference Benchmark (Eval Only)
  # -------------------------------------------------------------------------
  taste:
    display_name: "TASTE (multi-axis design-preference benchmark)"
    source_type: "huggingface"
    repo_id: "purvanshi/TASTE"
    revision: "main"
    category: "eval_design_multiaxis"
    expected_record_count: 1600
    license_url: "https://github.com/purvanshi-lica/taste/blob/main/LICENSE"
    license_status: "verified"
    license_notes: >
      CONFIRMED real and public. Ten professional designers, nine design criteria,
      evaluating UI outputs across model baselines. Held-out evaluation only.
    eval_only: true
    fetch_config:
      download_mode: "eval_reference"
      file_patterns: ["*.parquet", "*.json", "*.jsonl"]

  # -------------------------------------------------------------------------
  # PartiPrompts — Prompt Diversity Benchmark (Eval Only)
  # -------------------------------------------------------------------------
  partiprompts:
    display_name: "PartiPrompts (P2)"
    source_type: "huggingface"
    repo_id: "nateraw/parti-prompts"
    revision: "main"
    category: "eval_prompt_diversity"
    expected_record_count: 1632
    license_url: "https://huggingface.co/datasets/nateraw/parti-prompts"
    license_status: "verified"
    license_notes: "Apache 2.0, confirmed on the dataset card. Prompts only (PartiPrompts.tsv), no images."
    eval_only: true
    fetch_config:
      download_mode: "eval_reference"
      file_patterns: ["*.tsv"]


# ---------------------------------------------------------------------------
# Registry Watcher: datasets to scan for new releases
# ---------------------------------------------------------------------------
watcher_scan_targets:
  - query: "UI design dataset"
    platforms: ["huggingface", "github", "paperswithcode"]
    min_records: 1000
  - query: "mobile app screenshot dataset"
    platforms: ["huggingface"]
    min_records: 5000
  - query: "web interface design dataset"
    platforms: ["huggingface"]
    min_records: 1000
  - query: "DesignSense-10k Adobe layout preference dataset"
    platforms: ["huggingface", "github"]
    min_records: 1
  - query: "DesignPref UI design preference dataset release"
    platforms: ["huggingface", "github"]
    min_records: 1
