# =============================================================================
# Source Dataset Registry (v14 — no-RLHF-loop revision)
# =============================================================================
# Every dataset the pipeline fetches is registered here. The License
# Verification Agent (Stage 1) processes entries with license_status: unverified.
#
# v13 -> v14: removed glaive_function_calling/xlam_function_calling (dead —
# the planner ships frozen now, RAG over UICrit instead of fine-tuned SFT)
# and magicbrush/instructpix2pix (dead — Qwen-Image-Edit-2511 ships frozen,
# zero-shot ICL + SDEdit at inference, no paired edit-training data needed).
# Added pickapic_v2/hpdv2 (general DPO preference signal), designsense_10k/
# designpref (UI-domain DPO preference signal — closes the general-vs-UI
# domain gap the earlier PRD revision flagged), and taste/partiprompts
# (eval_only — held-out benchmark, never trained on). See
# docs/DATA_SOURCES.md for the full before/after rationale.
# =============================================================================

datasets:
  # -------------------------------------------------------------------------
  # PD12M — General Visual Backbone (Public Domain / CC0)
  # -------------------------------------------------------------------------
  pd12m:
    display_name: "PD12M (Public Domain 12M)"
    source_type: "huggingface"
    repo_id: "Spawning/PD12M"
    revision: "main"
    category: "general_visual"
    expected_record_count: 12400000
    license_url: "https://cdla.dev/permissive-2-0/"
    license_status: "unverified"
    license_notes: >
      CDLA-Permissive-2.0, entirely public domain / CC0 sourced. Should be a
      clean pass through the License Agent, but still runs through it rather
      than being assumed. NOTE: this dataset ships as parquet metadata +
      external image URLs (hosted on the pd12m S3 bucket), not bundled image
      files — the fetcher needs an img2dataset-style download path, not a
      plain file-pattern glob.
    fetch_config:
      file_patterns: ["*.parquet"]
      download_mode: "url_list"
      # UNVERIFIED, same discipline as models.yaml's unverified VAE channel
      # counts: PD12M's column names are believed to be "url"/"caption"
      # based on the dataset card at review time, but were not independently
      # re-confirmed against the live parquet schema before this revision.
      # Run `python -m data_forge.cli inspect-dataset pd12m` (or manually
      # `pd.read_parquet(...).columns`) against one shard before a real run
      # and correct these two keys if they differ.
      image_url_column: "url"
      caption_column: "caption"
      sample_size: 200000       # PRD target is 100K-500K curated TOTAL, not per-source
      download_concurrency: 32
      download_timeout_seconds: 15
      note: "Metadata-only repo; images are fetched via URL column, not bundled files."

  # -------------------------------------------------------------------------
  # CC12M — Supplementary General Visual Diversity
  # -------------------------------------------------------------------------
  cc12m:
    display_name: "CC12M (Conceptual 12M)"
    source_type: "huggingface"
    repo_id: "google-research-datasets/conceptual_12m"
    revision: "main"
    category: "general_visual"
    expected_record_count: 12423374
    license_url: "https://github.com/google-research-datasets/conceptual-12m/blob/main/README.md"
    license_status: "unverified"
    license_notes: >
      Google-provided "AS IS", freely usable with attribution — but the
      underlying images are web-scraped and unverified per-image, so this
      is intentionally routed through License Agent + Safety/Aesthetic
      gates rather than trusted wholesale.
    fetch_config:
      file_patterns: ["*.parquet", "*.tsv"]
      download_mode: "url_list"
      # UNVERIFIED — CC12M's canonical raw distribution is a headerless TSV
      # (caption, url in that order; see fetcher.py's tsv fallback branch,
      # which assumes exactly that column order). If this HF mirror instead
      # exposes parquet with a header, confirm the real column names before
      # a production run and correct these two keys — do not assume they
      # match PD12M's just because both are "general visual" sources.
      image_url_column: "url"
      caption_column: "caption"
      sample_size: 150000       # smaller share than PD12M — weaker legal cleanliness per PRD §8.1
      download_concurrency: 32
      download_timeout_seconds: 15
      note: "Image URLs only; source images are not owned/hosted by this dataset."

  # -------------------------------------------------------------------------
  # RICO — Mobile App UI Screenshots + Metadata
  # -------------------------------------------------------------------------
  rico_core:
    display_name: "RICO (Core UI Screenshots)"
    source_type: "huggingface"
    repo_id: "creative-graphic-design/Rico"
    revision: "main"
    subset: null                        # Full dataset
    category: "mobile_ui"
    expected_record_count: 66000        # ~66k unique UIs
    license_url: "http://www.interactionmining.org/rico.html"
    license_status: "unverified"
    license_notes: >
      Original RICO license status is listed as "Unknown" in most HuggingFace repos.
      The dataset contains third-party app screenshots — IP/privacy implications
      for commercial use. The license agent will likely route this to
      excluded_pending_review on first run.
    fetch_config:
      file_patterns: ["*.jpg", "*.png", "*.json"]
      max_files: null                   # No limit

  rico_semantic:
    display_name: "RICO Semantic Annotations"
    source_type: "huggingface"
    repo_id: "Voxel51/rico"
    revision: "main"
    category: "mobile_ui"
    expected_record_count: 66000
    license_url: "https://huggingface.co/datasets/Voxel51/rico"
    license_status: "unverified"
    license_notes: "Semantic annotations layer — CC BY 4.0 for Google-added labels."
    fetch_config:
      file_patterns: ["*.json"]

  # -------------------------------------------------------------------------
  # CLAY — Mobile UI Layouts (Google Research)
  # -------------------------------------------------------------------------
  clay:
    display_name: "CLAY (Mobile UI Layouts)"
    source_type: "github"
    repo_url: "https://github.com/google-research-datasets/clay"
    branch: "main"
    category: "mobile_ui"
    expected_record_count: 60000        # Approximate
    license_url: null                   # Archived repo, no explicit license file
    license_status: "unverified"
    license_notes: >
      Repository archived April 2026, read-only. License status unclear.
      Contains human-annotated screen layouts from Android apps.
      Likely to route to excluded_pending_review.
    fetch_config:
      file_patterns: ["*.csv", "*.json"]

  # -------------------------------------------------------------------------
  # Enrico — High-quality curated subset of RICO (1460 UIs, 20 topics)
  # -------------------------------------------------------------------------
  enrico:
    display_name: "Enrico (Enhanced RICO)"
    source_type: "github"
    repo_url: "https://github.com/luileito/enrico"
    branch: "master"
    category: "mobile_ui"
    expected_record_count: 1460
    license_url: null                   # No explicit LICENSE file in repo
    license_status: "unverified"
    license_notes: >
      Manually curated 1460-UI subset of RICO (Leiva et al., 2020). Inherits
      RICO's own unclear licensing since it's a re-annotation of RICO screens,
      not independently-sourced images — treat as no more permissive than
      rico_core. Used primarily for held-out eval / verifier calibration
      rather than the training pool.
    fetch_config:
      file_patterns: ["*.jpg", "*.csv"]

  # -------------------------------------------------------------------------
  # WebUI — Web Interface Screenshots
  # -------------------------------------------------------------------------
  webui:
    display_name: "WebUI (biglab)"
    source_type: "huggingface"
    repo_id: "biglab/webui-350k"
    revision: "main"
    category: "web_ui"
    expected_record_count: 350000
    license_url: "https://github.com/js0nwu/webui/blob/main/COPYRIGHT.txt"
    license_status: "unverified"
    license_notes: >
      biglab/webui-350k is the HF-published, explicit-content-filtered subset
      (biglab/webui-all is the unfiltered 550GB superset — deliberately NOT
      used here). License terms are per the source repo's own COPYRIGHT.txt,
      not a standard OSS license — review before treating as clear.
    fetch_config:
      file_patterns: ["*.jpg", "*.png", "*.json"]

  # -------------------------------------------------------------------------
  # Screen2Words — Dense Caption Training Pairs
  # -------------------------------------------------------------------------
  screen2words:
    display_name: "Screen2Words (RICO Screen Summaries)"
    source_type: "huggingface"
    repo_id: "bevaya/RICO-Screen2Words"
    revision: "main"
    category: "ui_captions"
    expected_record_count: 22417
    license_url: "https://huggingface.co/datasets/bevaya/RICO-Screen2Words"
    license_status: "unverified"
    license_notes: "CC-BY-4.0 per the HF dataset card. Screens are RICO images; captions are original to Screen2Words."
    fetch_config:
      file_patterns: ["*.parquet"]
      download_mode: "caption_join"
      # UNVERIFIED, same discipline as PD12M/CC12M's column-name notes:
      # Screen2Words is captions FOR RICO's screens, so path (b) — join
      # against rico_core by ID — is the expected shape, not path (a)
      # (bundled images). join_id_column left unset so the fetcher
      # auto-detects from {rico_id, screen_id, image_id, id}; set it
      # explicitly here if the real column name doesn't match any of
      # those once checked against the live repo.
      join_target_dataset: "rico_core"
      caption_column: "caption"

  # -------------------------------------------------------------------------
  # UICrit — UI Critique / DPO Preference Seed Data
  # -------------------------------------------------------------------------
  uicrit:
    display_name: "UICrit (UI Critique Dataset)"
    source_type: "github"
    repo_url: "https://github.com/google-research-datasets/uicrit"
    branch: "main"
    category: "ui_critique"
    expected_record_count: 1000
    license_url: "https://arxiv.org/abs/2407.08850"
    license_status: "unverified"
    license_notes: >
      CRITICAL: seeds the DPO preference pairs and trains the Tier-1 Audit
      Agent rubric — verify this one carefully before treating it as
      excluded_pending_review boilerplate. Per the paper, licensed CC
      BY-ND (Attribution-NoDerivs), which restricts redistribution of
      modified/derivative versions — flag for manual legal review even if
      the License Agent scores it otherwise, since NoDerivs interacts
      awkwardly with a pipeline that recaptions/re-annotates everything.
    # BUG FIX: UICrit's screenshots ARE RICO's screenshots — its actual
    # value is its rating/critique annotations, joined against images
    # rico_core/rico_semantic already ingested. annotation_only=true stops
    # the generic github fetch path from cloning this repo and finding
    # zero images to scan (its images aren't even bundled here). See
    # data_forge/data/uicrit_ingest.py and stages/s01_5_uicrit_join.py —
    # UNVERIFIED: the actual join key (which UICrit column identifies the
    # RICO screen) and the annotation file's real column names need
    # confirming against the live repo before a production run; the
    # ingest module's docstring lists every candidate name it tries and
    # logs loudly (not silently) if none match, rather than guessing.
    annotation_only: true
    fetch_config:
      file_patterns: ["*.json", "*.csv"]

  # ---------------------------------------------------------------------
  # DPO Preference-Pair Datasets (no-RLHF-loop revision — replaces the
  # removed Glaive/xLAM format-teacher references AND the removed
  # MagicBrush/InstructPix2Pix edit-pair references). These are real,
  # already-published, human-labeled preference comparisons — the DPO
  # training signal for Z-Image-Turbo (the only fine-tuned renderer).
  # download_mode: "preference_pair" — see
  # fetcher.py::_fetch_huggingface_preference_pairs and
  # stages/s01_6_preference_pairs.py.
  # ---------------------------------------------------------------------
  pickapic_v2:
    display_name: "Pick-a-Pic v2"
    source_type: "huggingface"
    repo_id: "yuvalkirstain/pickapic_v2"
    revision: "main"
    category: "dpo_preference_general"
    expected_record_count: 500000       # Approximate — HF viewer stats vary by
                                         # split/dedup; sample_size below is the
                                         # real operative cap regardless.
    license_url: "https://huggingface.co/datasets/yuvalkirstain/pickapic_v2"
    license_status: "unverified"
    license_notes: >
      Real, web-collected human preference comparisons (pickapic.io), MIT
      license per the PickScore repo. General text-to-image domain, not
      UI-specific — this is Stage-1 DPO signal (broad aesthetic alignment),
      not a substitute for the UI-domain datasets below. Image bytes are
      embedded directly in columns jpg_0/jpg_1 per the dataset card — no
      external URL fetch needed.
    fetch_config:
      file_patterns: ["*.parquet"]
      download_mode: "preference_pair"
      # VERIFIED column existence from the dataset card (jpg_0/jpg_1 hold
      # image bytes); the exact label-column name (commonly label_0) was
      # NOT independently re-confirmed against a live parquet shard before
      # this revision — same "confirm before a real run" discipline as
      # PD12M/CC12M's column-name notes above. Override here if
      # auto-detection logs show it guessed wrong.
      image_a_column: "jpg_0"
      image_b_column: "jpg_1"
      prompt_column: "caption"
      label_column: "label_0"
      label_convention: "index"
      sample_size: 60000

  hpdv2:
    display_name: "HPDv2 (Human Preference Dataset v2)"
    source_type: "huggingface"
    repo_id: "ymhao/HPDv2"
    revision: "main"
    category: "dpo_preference_general"
    expected_record_count: 798000       # ~798K pairwise comparisons / ~434K images per dataset card
    license_url: "https://huggingface.co/datasets/ymhao/HPDv2"
    license_status: "unverified"
    license_notes: "Apache 2.0, confirmed on the dataset card. Real human annotator rankings, general T2I domain."
    fetch_config:
      file_patterns: ["*.parquet", "*.json"]
      download_mode: "preference_pair"
      sample_size: 60000
      # IMPORTANT — UNVERIFIED SHAPE MISMATCH: HPDv2's native annotation
      # format (train.json: `human_preference: list[int]`, `file_path:
      # list[str]` — a variable-length ranked list per prompt, not a fixed
      # two-image parquet row) does NOT match the simple (image_a, image_b,
      # label) shape _fetch_huggingface_preference_pairs auto-detects
      # against. A parquet mirror may expose a flattened two-image view,
      # but this was not confirmed against the live repo before this
      # revision. Inspect the actual files before a production run; this
      # source may need a small dedicated adapter (flatten each ranked
      # list into consecutive winner/loser pairs) rather than the generic
      # path — do not assume the generic fetcher will "just work" here.

  # ---------------------------------------------------------------------
  # DPO Preference-Pair Datasets — UI/design domain. This is the actual
  # gap-closer: Pick-a-Pic/HPDv2 above are general-photo aesthetic, not
  # design-domain. These are real, human-designer-labeled comparisons
  # used as a small-batch Stage-2 DPO pass on top of the general pass —
  # see the PRD's ablation (c): general-only vs. +domain-augmented DPO,
  # evaluated against TASTE below.
  # ---------------------------------------------------------------------
  designsense_10k:
    display_name: "DesignSense-10k"
    source_type: "huggingface"
    repo_id: null    # CONFIRMED no public dataset release found (checked
                      # the paper directly — arXiv:2602.23438, Adobe MDSR,
                      # Gopal et al., Feb 2026 — no HF/GitHub data link
                      # anywhere in the paper or its listing). Re-check via
                      # s11_registry_watcher rather than assuming this will
                      # resolve itself.
    revision: "main"
    category: "dpo_preference_ui_layout"
    expected_record_count: 10235
    license_url: "https://arxiv.org/abs/2602.23438"
    license_status: "unverified"
    license_notes: >
      CONFIRMED CC BY-NC-ND 4.0 (arXiv's own license badge) — a harder
      blocker than the missing repo_id. NoDerivs conflicts directly with
      this pipeline's recaption/re-annotation discipline (same category of
      issue as UICrit's NoDerivs, see below), and NonCommercial is a
      separate problem for any project with a product track attached, not
      just the research paper. Even if a public release appears later,
      treat this as needing dedicated legal sign-off before use, not just
      a License Agent pass — do not assume "found the repo" alone clears
      it. Pair construction also reportedly includes a "VLM-based
      refinement" curation step — confirm that touches layout *selection*
      only, not pixel generation, if this is ever revisited.
    fetch_config:
      download_mode: "preference_pair"
      sample_size: 10235

  designpref:
    display_name: "DesignPref"
    source_type: "huggingface"
    repo_id: null    # CONFIRMED NOT YET PUBLICLY RELEASED — this is not a
                      # search failure. DesignPref's own describing paper
                      # (Peng et al., 25 Nov 2025) has no data link, and
                      # TASTE's related-work section (arXiv:2605.20731,
                      # Zhu et al., independently corroborating as of its
                      # June 2026 revision) states outright: "DesignPref
                      # describes a UI-design pairwise dataset whose data
                      # has not yet been released." There is no repo to
                      # find yet. Track via s11_registry_watcher for a
                      # future release rather than re-searching manually.
    revision: "main"
    category: "dpo_preference_ui_layout"
    expected_record_count: 12000
    license_url: null
    license_status: "unverified"
    license_notes: >
      Real professional-designer pairwise comparisons per the paper
      (12,000 pairs, 20 designers, identity-linked). Notably reports low
      inter-designer agreement (Krippendorff's alpha ~0.25) — worth citing
      directly as a limitation, not just training signal, since it
      documents that "good UI" is genuinely contested even among experts.
      License unknown until a release exists; do not assume permissive.
    fetch_config:
      download_mode: "preference_pair"
      sample_size: 12000

  # ---------------------------------------------------------------------
  # Evaluation-only reference datasets. download_mode: "eval_reference" —
  # these never enter training_pool/ or preference_pairs/ under any
  # config; see fetcher.py::_fetch_eval_reference, which is the only code
  # path that touches them and writes exclusively to
  # heldout/external_eval/. eval_only: true is a second, redundant
  # safeguard (checked explicitly in s01_6_preference_pairs.py) — belt
  # and suspenders, not decorative.
  # ---------------------------------------------------------------------
  taste:
    display_name: "TASTE (multi-axis design-preference benchmark)"
    source_type: "huggingface"
    repo_id: "purvanshi/TASTE"   # CONFIRMED — the paper itself
                                  # (arXiv:2605.20731, Zhu et al., 2026)
                                  # states directly: "Data:
                                  # https://huggingface.co/datasets/purvanshi/TASTE".
                                  # GitHub analysis code:
                                  # github.com/purvanshi-lica/taste.
    revision: "main"
    category: "eval_design_multiaxis"
    expected_record_count: 1600
    license_url: "https://github.com/purvanshi-lica/taste/blob/main/LICENSE"
    license_status: "unverified"   # repo/license existence confirmed via the
                                    # paper's own text (MIT, per its README);
                                    # still routed through the License Agent
                                    # rather than hardcoded, per this
                                    # registry's standing discipline.
    license_notes: >
      CONFIRMED real and public. Two disjoint cohorts of five professional
      designers each (ten total), nine criteria (typography, aesthetics,
      spatial, tone, ...), ranking outputs from four current T2I models —
      1,600 ratings per criterion, both pairwise comparisons and derived
      4-way rankings released. Ships with its own signal-validation
      framework (Kendall's tau, majority-vote probability, Condorcet
      cycles against iid-uniform nulls) — worth adopting for this
      project's own DPO ablation reporting, not just using the labels.
      Too small to train on but genuinely multi-dimensional and
      human-expert — used as held-out evaluation only.
    eval_only: true
    fetch_config:
      download_mode: "eval_reference"
      file_patterns: ["*.parquet", "*.json", "*.jsonl"]

  partiprompts:
    display_name: "PartiPrompts (P2)"
    source_type: "huggingface"
    repo_id: "nateraw/parti-prompts"
    revision: "main"
    category: "eval_prompt_diversity"
    expected_record_count: 1632
    license_url: "https://huggingface.co/datasets/nateraw/parti-prompts"
    license_status: "unverified"
    license_notes: "Apache 2.0, confirmed on the dataset card. Prompts only (PartiPrompts.tsv), no images — used to diversify the held-out evaluation prompt set, never for training."
    eval_only: true
    fetch_config:
      download_mode: "eval_reference"
      file_patterns: ["*.tsv"]


# ---------------------------------------------------------------------------
# Registry Watcher: datasets to scan for new releases
# ---------------------------------------------------------------------------
watcher_scan_targets:
  - query: "UI design dataset"
    platforms: ["huggingface", "github", "paperswithcode"]
    min_records: 1000
  - query: "mobile app screenshot dataset"
    platforms: ["huggingface"]
    min_records: 5000
  - query: "web interface design dataset"
    platforms: ["huggingface"]
    min_records: 1000
  # New — specific watches for the two confirmed-not-yet-released
  # UI/design-domain DPO preference datasets (designsense_10k, designpref
  # above both have repo_id: null for this exact reason). Generic "UI
  # design dataset" queries above wouldn't reliably resurface these by
  # name once released — watch for them explicitly instead of relying on
  # a manual re-search each time this file is reviewed.
  - query: "DesignSense-10k Adobe layout preference dataset"
    platforms: ["huggingface", "github"]
    min_records: 1
  - query: "DesignPref UI design preference dataset release"
    platforms: ["huggingface", "github"]
    min_records: 1
