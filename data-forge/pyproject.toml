[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-forge"
version = "0.13.0"
description = "Zero-touch automated data pipeline for the Krisna project (v13 spec)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "Proprietary" }

dependencies = [
    # --- Inference ---
    "vllm>=0.18.0",
    "openai>=1.40",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.45",
    "safetensors>=0.4.5",

    # --- Data / ML ---
    "faiss-gpu>=1.8.0",
    "Pillow>=10.4",
    "numpy>=1.26",
    "scipy>=1.14",

    # --- Schemas & Validation ---
    "pydantic>=2.8",
    "jsonschema>=4.23",

    # --- Config & CLI ---
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.8",

    # --- Networking ---
    "httpx>=0.27",
    "huggingface-hub>=0.24",

    # --- Logging ---
    "structlog>=24.4",

    # --- PII Detection ---
    "mediapipe>=0.10.14",

    # --- Storage ---
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "aiosqlite>=0.20",
]

[project.scripts]
data-forge = "data_forge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_forge*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require GPU / vLLM (deselect with '-m \"not integration\"')",
    "slow: marks tests that take >30s",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
